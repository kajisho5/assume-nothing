name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Format
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: End-to-end hook check
        shell: bash
        run: scripts/smoke.sh
      - name: PowerShell setup script parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/setup.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
      - name: PowerShell setup installs and removes the Cursor hooks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup.ps1 cursor
          $cfg = Join-Path $HOME ".cursor/hooks.json"
          if (-not (Select-String -Path $cfg -Pattern "--agent cursor" -Quiet)) { Get-Content $cfg; exit 1 }
          ./scripts/setup.ps1 cursor -Remove
          if (Select-String -Path $cfg -Pattern "--agent cursor" -Quiet) { Get-Content $cfg; exit 1 }
