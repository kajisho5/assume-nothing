name: release

# On every push to main: if the version in .claude-plugin/plugin.json has no
# tag yet, test, build all binaries, publish the installable plugin on the
# `dist` branch, and create the GitHub release. Nothing to do by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          v=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "plugin.json has no valid version: '$v'"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released; nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        if: steps.v.outputs.new == 'true'
        with:
          go-version: '1.27.3'
      - name: Test
        if: steps.v.outputs.new == 'true'
        run: go test ./... && scripts/smoke.sh
      - name: Build
        if: steps.v.outputs.new == 'true'
        run: scripts/build.sh "${{ steps.v.outputs.version }}" out
      - name: Publish the dist branch
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          cd out/plugin
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "assume-nothing v$V (built from ${GITHUB_SHA})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
      - name: Create the release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          awk -v h="## [$V]" 'index($0, h) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "assume-nothing v$V" > notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md out/assets/*
